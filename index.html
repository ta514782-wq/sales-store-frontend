<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Store Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1d2433;--muted:#6b7385;--line:#e3e6ee;--brand:#3b5bdb}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--text:#e8ebf3;--muted:#98a1b5;--line:#2c3348;--brand:#748ffc}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header b{font-size:16px}header small{color:var(--muted);display:block;font-size:12px}
button{font:inherit;cursor:pointer}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 14px}
.out{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
nav button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:7px 14px;font-size:13px}
nav button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
main{padding:0 16px 32px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:17px;margin:4px 0 12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi span{color:var(--muted);font-size:12px;display:block}.kpi b{font-size:20px}
.box{position:relative;height:280px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:600}
input,select{width:100%;padding:11px;margin:5px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
.err{color:#e03131;font-size:14px;min-height:20px}
.hide{display:none}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
label{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <h2>Sales Store Login</h2>
    <input id="em" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <p class="err" id="lerr"></p>
    <button class="btn" style="width:100%" onclick="login()">Log in</button>
  </div>
</div>
<div id="app" class="hide">
  <header><div><b id="who"></b><small id="role"></small></div><div style="display:flex;gap:8px;align-items:center"><select id="sw" class="hide" onchange="switchStore(this.value)" style="width:auto;max-width:140px;margin:0;padding:6px"></select><button class="out" onclick="logout()">Log out</button></div></header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const API='https://sales-store-backend.vercel.app';
const $=s=>document.querySelector(s);
let token=null,chart=null,SID=null,STORES=[],CUR=null;
try{token=localStorage.getItem('tok')}catch(e){}
const PAL=['#3b5bdb','#f08c00','#2f9e44','#e03131','#7048e8','#0c8599','#d6336c','#868e96'];
const CFG={
 overview:{t:'Overview'},
 top_products:{t:'Top 5 products by quantity',type:'bar',x:'product_name',y:['units_sold']},
 cancelled_products:{t:'Most cancelled products',type:'bar',x:'product_name',y:['cancelled_orders']},
 top_customers:{t:'Top 5 customers by spending',type:'bar',x:'customer_name',y:['total_spent']},
 revenue_by_category:{t:'Revenue by category',type:'bar',x:'category_name',y:['revenue']},
 cancel_return_rate:{t:'Cancel / return rate by category (%)',type:'bar',x:'category_name',y:['cancel_return_pct']},
 payment_modes:{t:'Payment modes',type:'doughnut',x:'payment_mode',y:['orders']},
 age_behavior:{t:'Age group behavior (revenue)',type:'bar',x:'age_group',y:['revenue']},
 monthly_sales:{t:'Monthly sales trend',type:'line',x:'month',y:['revenue']},
 gender_category:{t:'Gender vs category (orders)',type:'bar',pivot:true},
 peak_hours:{t:'Orders by hour of day',type:'bar',x:'hour_of_day',y:['orders'],sort:'hour_of_day'},
 order_status:{t:'Order status',type:'doughnut',x:'status',y:['orders']},
 lost_revenue:{t:'Lost revenue by month',type:'bar',x:'month',y:['cancelled_value','returned_value'],stack:true},
 inventory_status:{t:'Stock levels',type:'bar',x:'product_name',y:['stock_qty','reorder_level'],filt:'none'},
 low_stock:{t:'Low stock alert',type:'bar',x:'product_name',y:['stock_qty','reorder_level'],filt:'none'},
 sales_forecast:{t:'Sales forecast (next month)',filt:'cat'}
};
const num=v=>v!==null&&v!==''&&!isNaN(v)?Number(v):null;
const fmt=(k,v)=>{if(v==null)return '-';if(k==='month')return String(v).slice(0,7);const n=num(v);return n!==null&&typeof v!=='boolean'?n.toLocaleString():v};
const lab=k=>k.replace(/_/g,' ');
async function api(p,o={}){
  const r=await fetch(API+p,{...o,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(SID?{'X-Store-Id':String(SID)}:{})}});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401&&token)logout();throw new Error(d.error||'Something went wrong')}
  return d;
}
async function login(){
  $('#lerr').textContent='';
  try{
    const d=await api('/api/login',{method:'POST',body:JSON.stringify({email:$('#em').value.trim(),password:$('#pw').value})});
    token=d.token;try{localStorage.setItem('tok',token)}catch(e){}
    start();
  }catch(e){$('#lerr').textContent=e.message}
}
function logout(){token=null;try{localStorage.removeItem('tok')}catch(e){}location.reload()}
async function start(){
  try{
    const me=await api('/api/me');
    $('#login').classList.add('hide');$('#app').classList.remove('hide');
    $('#who').textContent=me.name;
    const RL={super_admin:'store admin',platform_admin:'platform admin'};
    $('#role').textContent=(RL[me.role]||me.role.replace(/_/g,' '))+(me.store?' · '+me.store.name:'');
    if(me.role==='platform_admin'){
      STORES=me.stores||[];
      let sid=0;try{sid=+localStorage.getItem('sid')}catch(e){}
      if(!STORES.some(x=>x.store_id===sid))sid=STORES.length?STORES[0].store_id:null;
      SID=sid;
      const sw=$('#sw');
      sw.innerHTML=STORES.map(x=>`<option value="${x.store_id}"${x.store_id===SID?' selected':''}>${esc(x.store_name)}</option>`).join('');
      sw.classList.remove('hide');
    }
    const items=me.dashboards.map(k=>[k,(CFG[k]||{t:lab(k)}).t]);
    const R=me.role;
    if(['platform_admin','super_admin','store_manager','logistics'].includes(R))items.push(['__orders','Orders']);
    if(['platform_admin','super_admin','store_manager'].includes(R))items.push(['__neworder','New order']);
    if(['platform_admin','super_admin','inventory'].includes(R))items.push(['__restock','Restock']);
    if(R==='platform_admin')items.push(['__stores','Stores']);
    if(['platform_admin','super_admin'].includes(R))items.push(['__users','Users']);
    items.push(['__account','Password']);
    $('#nav').innerHTML=items.map(([k,t])=>`<button data-k="${k}">${t.split(' by ')[0].split(' (')[0]}</button>`).join('');
    $('#nav').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.k)};
    show(items[0][0]);
  }catch(e){}
}
function table(rows){
  if(!rows.length)return '<p>No data.</p>';
  const ks=Object.keys(rows[0]);
  return `<div class="tw"><table><tr>${ks.map(k=>`<th>${lab(k)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${ks.map(k=>`<td>${fmt(k,r[k])}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
let FIL={from:'',to:'',cat:''},CATS=null;
const qs=()=>'?from='+FIL.from+'&to='+FIL.to+'&category='+encodeURIComponent(FIL.cat);
function filterBar(k,c){
  const f=c.filt||'all';
  if(f==='none')return `<div class="card"><button class="out" onclick="csv('${k}')">Download CSV</button><p id="fm" class="err"></p></div>`;
  const dt=f==='all'?`<label>From<input type="date" id="ff" value="${FIL.from}"></label><label>To<input type="date" id="ft" value="${FIL.to}"></label>`:'';
  return `<div class="card"><div class="fg">${dt}<label>Category<select id="fc"><option value="">All</option>${CATS.map(x=>`<option${FIL.cat===x?' selected':''}>${esc(x)}</option>`).join('')}</select></label></div><button class="btn" onclick="applyF('${k}')">Apply</button> <button class="out" onclick="resetF('${k}')">Reset</button> <button class="out" onclick="csv('${k}')">Download CSV</button><p id="fm" class="err"></p></div>`;
}
function applyF(k){
  const a=$('#ff'),b=$('#ft');
  if(a&&b&&a.value&&b.value&&a.value>b.value)return msg('fm','The From date must be before the To date');
  if(a)FIL.from=a.value;
  if(b)FIL.to=b.value;
  FIL.cat=$('#fc').value;
  show(k);
}
function resetF(k){FIL={from:'',to:'',cat:''};show(k)}
async function csv(k){
  try{
    const r=await fetch(API+'/api/dashboard/'+k+qs()+'&format=csv',{headers:{Authorization:'Bearer '+token,...(SID?{'X-Store-Id':String(SID)}:{})}});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Download failed')}
    const b=await r.blob(),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=k+'.csv';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }catch(e){msg('fm',e.message)}
}
async function show(k){
  CUR=k;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  const m=$('#main');m.innerHTML='<div class="card">Loading...</div>';
  if(chart){chart.destroy();chart=null}
  try{
    if(k==='__users')return users();
    if(k==='__orders')return orders();
    if(k==='__neworder')return newOrder();
    if(k==='__restock')return restock();
    if(k==='__account')return account();
    if(k==='__stores')return stores();
    const c=CFG[k]||{t:lab(k)};
    if(!CATS)CATS=await api('/api/categories');
    const {rows,forecast}=await api('/api/dashboard/'+k+qs());
    const fb=filterBar(k,c);
    const col=getComputedStyle(document.body).color;
    if(k==='overview'){
      const r=rows[0]||{};
      const L={total_orders:'Total orders',delivered_orders:'Delivered',revenue:'Revenue',avg_order_value:'Avg order value',customers:'Customers',cancel_return_pct:'Cancel/return %'};
      m.innerHTML=`<h2>${c.t}</h2>${fb}<div class="kpis">${Object.keys(L).map(x=>`<div class="kpi"><span>${L[x]}</span><b>${fmt(x,r[x])}</b></div>`).join('')}</div>`;
      return;
    }
    if(!rows.length){m.innerHTML=`<h2>${c.t}</h2>${fb}<div class="card">No data for these filters.</div>`;return}
    if(k==='sales_forecast'){
      const f=forecast,a=rows.filter(r=>r.type==='actual');
      const sl=f.slope,trend=Math.abs(sl)<1?'no clear trend':(sl>0?'rising':'falling')+' by about '+fmt('x',Math.abs(sl))+' per month';
      const note=`Based on the last ${f.n} complete months (${f.first} to ${f.last}; a complete month has 30+ orders) using a straight-line trend. Trend: ${trend}. `+(f.r2<0.3?'The trend explains very little of the month-to-month change (low R²), so use the 3-month average and the likely range as a rough guide.':'The trend fits the history reasonably well.');
      m.innerHTML=`<h2>${c.t}</h2>${fb}<div class="kpis"><div class="kpi"><span>Forecast ${f.next_month} (trend)</span><b>${fmt('x',f.linear)}</b></div><div class="kpi"><span>3-month average</span><b>${fmt('x',f.ma3)}</b></div><div class="kpi"><span>Likely range (95%)</span><b style="font-size:15px">${fmt('x',f.low)} - ${fmt('x',f.high)}</b></div><div class="kpi"><span>Trend fit (R²)</span><b>${f.r2}</b></div></div><div class="card" style="margin-top:14px"><div class="box"><canvas id="cv"></canvas></div></div><div class="card"><p style="margin:0;font-size:13px;color:var(--muted)">${esc(note)}</p></div><div class="card">${table(rows)}</div>`;
      const labels=a.map(r=>r.month).concat(f.next_month);
      chart=new Chart($('#cv'),{type:'line',data:{labels,datasets:[
        {label:'Actual revenue',data:a.map(r=>r.revenue).concat(null),borderColor:PAL[0],backgroundColor:PAL[0],tension:.3},
        {label:'Forecast (trend)',data:a.map((r,i)=>i===a.length-1?r.revenue:null).concat(f.linear),borderColor:PAL[1],backgroundColor:PAL[1],borderDash:[6,4]}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:col}}},scales:{x:{ticks:{color:col}},y:{ticks:{color:col}}}}});
      return;
    }
    let data=rows.slice();
    if(c.sort)data.sort((a,b)=>a[c.sort]-b[c.sort]);
    let labels,sets;
    if(c.pivot){
      labels=[...new Set(data.map(r=>r.category_name))];
      sets=['Male','Female'].map((g,i)=>({label:g,backgroundColor:PAL[i],data:labels.map(l=>{const r=data.find(x=>x.category_name===l&&x.gender===g);return r?num(r.orders):0})}));
    }else{
      labels=data.map(r=>fmt(c.x,r[c.x]));
      const pie=c.type==='doughnut';
      sets=c.y.map((y,i)=>({label:lab(y),data:data.map(r=>num(r[y])||0),backgroundColor:pie?PAL:PAL[i],borderColor:PAL[i],tension:.3}));
    }
    m.innerHTML=`<h2>${c.t}</h2>${fb}<div class="card"><div class="box"><canvas id="cv"></canvas></div></div><div class="card">${table(rows)}</div>`;
    chart=new Chart($('#cv'),{type:c.type,data:{labels,datasets:sets},options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:c.type==='doughnut'||sets.length>1,labels:{color:col}}},
      scales:c.type==='doughnut'?{}:{x:{stacked:!!c.stack,ticks:{color:col}},y:{stacked:!!c.stack,ticks:{color:col}}}}});
  }catch(e){m.innerHTML=`<div class="card err">${esc(e.message)}</div>`}
}
function account(){
  $('#main').innerHTML=`<h2>Change password</h2><div class="card"><input id="cp" type="password" placeholder="Current password" autocomplete="current-password"><input id="np1" type="password" placeholder="New password (8+ characters)" autocomplete="new-password"><input id="np2" type="password" placeholder="Repeat new password" autocomplete="new-password"><p id="am"></p><button class="btn" onclick="changePw()">Change password</button></div>`;
}
async function changePw(){
  if($('#np1').value!==$('#np2').value)return msg('am','The new passwords do not match');
  try{
    await api('/api/change-password',{method:'POST',body:JSON.stringify({current_password:$('#cp').value,new_password:$('#np1').value})});
    ['cp','np1','np2'].forEach(i=>$('#'+i).value='');
    msg('am','Password changed. Use the new one next time you log in.',1);
  }catch(e){msg('am',e.message)}
}
async function users(){
  const rows=await api('/api/users');
  const roles=['super_admin','senior_management','store_manager','inventory','marketing','logistics','finance'];
  $('#main').innerHTML=`<h2>Users</h2><div class="card">${table(rows)}</div>
  <div class="card"><h2>Add user</h2>
  <input id="nn" placeholder="Full name"><input id="ne" type="email" placeholder="Email"><input id="np" type="password" placeholder="Password (8+ characters)">
  <select id="nr">${roles.map(r=>`<option>${r}</option>`).join('')}</select>
  <p class="err" id="uerr"></p><button class="btn" onclick="addUser()">Add user</button></div>`;
}
async function addUser(){
  try{
    await api('/api/users',{method:'POST',body:JSON.stringify({full_name:$('#nn').value,email:$('#ne').value,password:$('#np').value,role_name:$('#nr').value})});
    users();
  }catch(e){$('#uerr').textContent=e.message}
}

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msg=(id,t,ok)=>{const e=$('#'+id);if(e){e.textContent=t;e.style.color=ok?'#2f9e44':'#e03131'}};
async function orders(){
  $('#main').innerHTML=`<h2>Orders</h2><div class="card"><select id="fs" onchange="loadOrders()"><option value="">All statuses</option><option>pending</option><option>delivered</option><option>cancelled</option><option>returned</option></select><input id="fq" placeholder="Search transaction ID" oninput="loadOrders()"><p id="om"></p><div id="ol"></div></div>`;
  loadOrders();
}
const acts=r=>r.status==='pending'?`<button class="out" onclick="setSt('${r.transaction_id}','delivered')">Deliver</button> <button class="out" onclick="setSt('${r.transaction_id}','cancelled')">Cancel</button>`:r.status==='delivered'?`<button class="out" onclick="setSt('${r.transaction_id}','returned')">Return</button>`:'';
async function loadOrders(){
  try{
    const rows=await api('/api/orders?status='+encodeURIComponent($('#fs').value)+'&q='+encodeURIComponent($('#fq').value.trim()));
    $('#ol').innerHTML=rows.length?`<div class="tw"><table><tr><th>ID</th><th>Customer</th><th>Product</th><th>Qty</th><th>Total</th><th>Status</th><th>Action</th></tr>${rows.map(r=>`<tr><td>${esc(r.transaction_id)}</td><td>${esc(r.customer_name||'-')}</td><td>${esc(r.product_name)}</td><td>${r.quantity}</td><td>${fmt('x',r.total_price)}</td><td>${r.status}</td><td>${acts(r)}</td></tr>`).join('')}</table></div>`:'<p>No orders.</p>';
  }catch(e){msg('om',e.message)}
}
async function setSt(id,s){
  try{await api('/api/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:s})});await loadOrders();msg('om','Order '+id+' is now '+s,1)}catch(e){msg('om',e.message)}
}
async function newOrder(){
  const ps=await api('/api/products');
  $('#main').innerHTML=`<h2>New order</h2><div class="card">
  <input id="oc" list="cl" placeholder="Customer: type name or ID" oninput="findCust(this.value)"><datalist id="cl"></datalist>
  <details><summary style="font-size:13px;color:var(--muted);cursor:pointer;margin:4px 0">New customer?</summary><input id="cn" placeholder="Customer name"><input id="ca" type="number" min="10" max="100" placeholder="Age"><select id="cg"><option>Female</option><option>Male</option></select><p id="cm"></p><button class="out" onclick="addCust()">Add customer</button></details>
  <select id="op">${ps.map(p=>`<option value="${p.product_id}">${esc(p.product_name)} (${esc(p.category_name)}) - stock ${p.stock_qty}</option>`).join('')}</select>
  <input id="oq" type="number" min="1" placeholder="Quantity"><input id="ot" type="number" min="0" placeholder="Total price">
  <select id="opm">${['Cash','UPI','EMI','Debit Card','Credit Card'].map(x=>`<option>${x}</option>`).join('')}</select>
  <p id="nm"></p><button class="btn" onclick="saveOrder()">Place order</button></div>`;
}
let ft;
function findCust(v){clearTimeout(ft);if(v.length<2)return;ft=setTimeout(async()=>{try{const r=await api('/api/customers?q='+encodeURIComponent(v));$('#cl').innerHTML=r.map(c=>`<option value="${esc(c.customer_id)} - ${esc(c.customer_name)}">`).join('')}catch(e){}},300)}
async function saveOrder(){
  const cid=$('#oc').value.split(' - ')[0].trim();
  try{
    const d=await api('/api/orders',{method:'POST',body:JSON.stringify({customer_id:cid,product_id:+$('#op').value,quantity:+$('#oq').value,total_price:+$('#ot').value,payment_mode:$('#opm').value})});
    msg('nm','Order '+d.transaction_id+' placed (pending). Deliver it from the Orders tab.',1);
  }catch(e){msg('nm',e.message)}
}
async function restock(){
  const ps=await api('/api/products');
  $('#main').innerHTML=`<h2>Restock</h2><div class="card"><select id="rp">${ps.map(p=>`<option value="${p.product_id}">${esc(p.product_name)} - stock ${p.stock_qty}</option>`).join('')}</select>
  <input id="rq" type="number" min="1" placeholder="Quantity received"><p id="rm"></p><button class="btn" onclick="doRestock()">Add stock</button></div>`;
}
async function doRestock(){
  try{const d=await api('/api/restock',{method:'POST',body:JSON.stringify({product_id:+$('#rp').value,quantity:+$('#rq').value})});await restock();msg('rm','Done. New stock: '+d.new_stock,1)}catch(e){msg('rm',e.message)}
}
function switchStore(v){SID=+v;try{localStorage.setItem('sid',v)}catch(e){}show(CUR||'overview')}
async function addCust(){
  try{
    const d=await api('/api/customers',{method:'POST',body:JSON.stringify({customer_name:$('#cn').value,age:+$('#ca').value,gender:$('#cg').value})});
    $('#oc').value=d.customer_id+' - '+d.customer_name;
    msg('cm','Added '+d.customer_id+'. It is filled in above.',1);
  }catch(e){msg('cm',e.message)}
}
async function stores(){
  const rows=await api('/api/stores');
  $('#main').innerHTML=`<h2>Stores</h2><div class="card"><div class="tw"><table><tr><th>Store</th><th>City</th><th>Orders</th><th>Revenue</th><th>Users</th><th></th></tr>${rows.map(r=>`<tr><td>${esc(r.store_name)}</td><td>${esc(r.city||'-')}</td><td>${fmt('x',r.orders)}</td><td>${fmt('x',r.revenue)}</td><td>${r.users}</td><td><button class="out" onclick="openStore(${r.store_id})">Open</button></td></tr>`).join('')}</table></div></div>
  <div class="card"><h2>Add a store</h2><input id="sn" placeholder="Store name"><input id="sc" placeholder="City (optional)"><input id="an" placeholder="Store admin full name"><input id="ae" type="email" placeholder="Store admin email"><input id="ap" type="password" placeholder="Store admin password (8+ characters)"><p id="sm"></p><button class="btn" onclick="addStore()">Create store</button></div>`;
}
function openStore(id){SID=id;try{localStorage.setItem('sid',id)}catch(e){}$('#sw').value=id;show('overview')}
async function addStore(){
  try{
    const d=await api('/api/stores',{method:'POST',body:JSON.stringify({store_name:$('#sn').value,city:$('#sc').value,admin_name:$('#an').value,admin_email:$('#ae').value,admin_password:$('#ap').value})});
    try{localStorage.setItem('sid',d.store_id)}catch(e){}
    const me=await api('/api/me');STORES=me.stores||[];SID=d.store_id;
    $('#sw').innerHTML=STORES.map(x=>`<option value="${x.store_id}"${x.store_id===SID?' selected':''}>${esc(x.store_name)}</option>`).join('');
    await stores();
    msg('sm','Store created and selected. Its admin can log in now. Its stock starts at 0, so restock first.',1);
  }catch(e){msg('sm',e.message)}
}
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
if(token)start();
</script>
